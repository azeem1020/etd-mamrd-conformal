# ==============================================================================
# MAMRD Default Configuration: SGCC Native-Prevalence Benchmark
# ==============================================================================
experiment:
  name: mamrd_sgcc_benchmark
  benchmark: SGCC
  data_path: data/SGCC.csv
  output_dir: results/phase_n_retrained
  seed_discipline: [0, 1, 2]
  fold_discipline: [0, 1, 2]
  extended_seeds: [3, 4]

model:
  architecture: a34_generic
  description: "Missingness-Aware Multi-Representation Detector (MAMRD)"
  parameters: 975076  # 0.97M total (974,833 trainable; 243 frozen Laplacian stencil weights)
  branches:
    - branch_1_wide_bimamba2_90
    - branch_2_value_2d_laplacian_cnn_60
    - branch_3_mask_2d_laplacian_cnn_30
    - branch_4_fixed_differencing_1d_cnn_32
    - branch_5_dilated_1d_periodicity_cnn_32
  frontend: cc_name
  sgcc_input_shape: [147, 7] # 147-week x 7-day cyclical grid (1,029 daily readings)
  ecl_input_shape: [7, 48]   # 7-day x 48-half-hour grid (336 half-hour readings)

training:
  optimizer: AdamW
  learning_rate: 0.0003
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  batch_size: 128
  eval_batch_size: 256
  epochs: 30
  loss: binary_cross_entropy
  gradient_clip_norm: 1.0
  mixed_precision: true
  checkpoint_selection:
    metric: validation_average_precision
    cohort: D_es
    frequency_epochs: 3

evaluation:
  cohorts:
    # Outer split: shuffled (unstratified) 5-fold KFold, random_state 0 (zkmix_lab.data.KFoldSpec,
    # family "random"); Folds 0-2 are evaluated. Each held-out fold (20 %) is split by stratified
    # sampling into three parts (rng = default_rng(fold)).
    outer_split: {method: KFold, shuffle: true, random_state: 0, n_folds: 5, evaluated_folds: [0, 1, 2]}
    training_fraction: 0.80
    heldout_fraction: 0.20
    heldout_split:          # order as returned by _stratified_three_way_split, SGCC (run_n_clean.py)
      early_stopping: 0.33
      threshold_calibration: 0.33
      test: 0.34
  conformal_audit:          # Workflow B: 20 stratified 50/50 resplits of the test part per cell
    method: class_conditional_mondrian
    target_recall: 0.80
    order_statistic: "ceil((n + 1) * (1 - alpha))"
    groups: [heavy, light, flat]
    resplits_per_cell: 20
    # No eligibility gate: if k > n (n < ceil((1 - alpha) / alpha)), q_hat = +inf and the whole
    # group is inspected (conformal_common.cc_recall_threshold); the cost enters the workload.
    below_n_min: inspect_whole_group

